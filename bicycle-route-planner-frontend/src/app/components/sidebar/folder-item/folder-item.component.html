<div class="folder-container">
  <div class="folder-header" [class.expanded]="isExpanded()">
    @let folderIcon = isExpanded() ? '📂' : '📁';

    @if (isRenaming()) {
      <span class="folder-icon padded-icon" aria-hidden="true">{{ folderIcon }}</span>
      <label class="sr-only" [for]="'rename-' + folder().id">{{ 'SIDEBAR.FOLDER_ITEM_NEW_NAME' | translate }}</label>
      <input
        [id]="'rename-' + folder().id"
        type="text"
        maxlength="100"
        [formControl]="renameControl"
        class="rename-input"
        (keyup.enter)="confirmRename()"
      />
      <button type="button" class="confirm-btn primary" (click)="confirmRename()" [disabled]="renameControl.invalid">OK</button>
      <button
        type="button"
        class="confirm-btn cancel"
        (click)="toggleRename()"
        [title]="'SIDEBAR.CANCEL' | translate"
        [attr.aria-label]="'SIDEBAR.CANCEL' | translate"
      >X</button>
    } @else if (isConfirmingDelete()) {
      <span class="folder-icon padded-icon" aria-hidden="true">{{ folderIcon }}</span>
      <span class="warning-text delete-warning">{{ 'SIDEBAR.FOLDER_ITEM_CONFIRM_DELETE' | translate }}</span>
      <button type="button" class="confirm-btn danger" (click)="confirmDelete()">{{ 'SIDEBAR.ROUTE_ITEM_YES' | translate }}</button>
      <button type="button" class="confirm-btn cancel" (click)="cancelDelete()">{{ 'SIDEBAR.ROUTE_ITEM_NO' | translate }}</button>
    } @else {
      <button
        type="button"
        class="folder-expand-btn"
        (click)="toggleExpanded()"
        [title]="'SIDEBAR.FOLDER_ITEM_TOGGLE' | translate"
        [attr.aria-expanded]="isExpanded()"
        [attr.aria-controls]="'folder-content-' + folder().id"
      >
        <span class="folder-icon" aria-hidden="true">{{ folderIcon }}</span>
        <span class="folder-name">{{ folder().name }}</span>
      </button>

      <div class="folder-actions">
        <button
          type="button"
          class="icon-btn edit-icon"
          (click)="toggleRename()"
          [title]="'SIDEBAR.FOLDER_ITEM_RENAME' | translate"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        </button>
        <button
          type="button"
          class="icon-btn delete-icon"
          (click)="promptDelete()"
          [title]="'SIDEBAR.FOLDER_ITEM_DELETE' | translate"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    }
  </div>

  @if (isExpanded()) {
    <div class="folder-children" [id]="'folder-content-' + folder().id">
      @for (route of folderRoutes(); track route.id) {
        <app-route-item
          [route]="route"
          [isSelected]="route.id === selectedRouteId()"
          [allFolders]="allFolders()">
        </app-route-item>
      }
    </div>
  }
</div>
