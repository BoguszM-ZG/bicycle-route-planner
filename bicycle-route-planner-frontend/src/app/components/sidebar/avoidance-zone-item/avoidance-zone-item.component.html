<div class="zone-card" [class.inactive]="!zone().isActive">
  <div class="zone-info">
    <div class="zone-name-row">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="zone-icon"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      <strong>{{ zone().name }}</strong>
    </div>
  </div>

  <div class="zone-actions">
    <label class="switch" [title]="'SIDEBAR.ZONE_ITEM_TOGGLE' | translate">
      <input type="checkbox" [checked]="zone().isActive" (change)="onToggleClick()">
      <span class="slider round"></span>
    </label>

    <button class="icon-btn delete-btn" (click)="onDeleteClick()" [title]="'SIDEBAR.ZONE_ITEM_DELETE' | translate">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
    </button>
  </div>
</div>
