<div class="zone-card" [class.inactive]="!zone().isActive && !isConfirmingDelete()">
  @if (isConfirmingDelete()) {
    <div class="delete-confirmation">
      <span class="warning-text">{{ 'SIDEBAR.ZONE_ITEM_CONFIRM_DELETE' | translate }}</span>
      <div class="action-buttons">
        <button class="confirm-btn danger" type="button" (click)="confirmDelete()">{{ 'SIDEBAR.ROUTE_ITEM_YES' | translate }}</button>
        <button class="confirm-btn cancel" type="button" (click)="cancelDelete()">{{ 'SIDEBAR.ROUTE_ITEM_NO' | translate }}</button>
      </div>
    </div>
  } @else {
    <div class="zone-info">
      <svg
        aria-hidden="true"
        focusable="false"
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="zone-icon"
      >
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <strong [title]="zone().name">{{ zone().name }}</strong>
    </div>

    <div class="zone-actions">
      <label class="switch" [title]="'SIDEBAR.ZONE_ITEM_TOGGLE' | translate">
        <input
          type="checkbox"
          [attr.aria-label]="('SIDEBAR.ZONE_ITEM_TOGGLE' | translate) + ' ' + zone().name"
          [checked]="zone().isActive"
          (change)="toggleActive()"
        >
        <span class="slider round"></span>
      </label>

      <button
        class="icon-btn delete-btn"
        type="button"
        (click)="promptDelete()"
        [title]="'SIDEBAR.ZONE_ITEM_DELETE' | translate"
      >
        <svg
          aria-hidden="true"
          focusable="false"
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>
    </div>
  }
</div>
