@if (isLoading()) {
  <div class="loading">{{ 'SIDEBAR.CHART_LOADING' | translate }}</div>
} @else if (chartData()) {
  <div class="chart-container">
    <canvas baseChart
            [data]="chartData()!"
            [options]="chartOptions()"
            [type]="'scatter'">
    </canvas>
  </div>
}
