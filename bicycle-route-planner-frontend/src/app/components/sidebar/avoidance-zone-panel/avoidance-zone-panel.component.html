<div class="panel-container glass-panel">
  <div class="panel-header">
    <div class="header-title">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header-icon"><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"></path><path d="m21 3-9 9"></path><path d="M15 3h6v6"></path></svg>
      <h3>{{ 'SIDEBAR.ZONES_PANEL_TITLE' | translate }}</h3>
    </div>
    <span class="badge">{{ zones().length }}</span>
  </div>

  @if (isLoading()) {
    <div class="loading-message" aria-live="polite" aria-busy="true">
      <p>{{ 'SIDEBAR.LOADING' | translate }}</p>
    </div>
  } @else if (zones().length === 0) {
    <div class="empty-message">
      <p>{{ 'SIDEBAR.ZONES_PANEL_EMPTY' | translate }}</p>
    </div>
  } @else {
    <div class="zones-list">
      @for (zone of zones(); track zone.id) {
        <app-avoidance-zone-item [zone]="zone"></app-avoidance-zone-item>
      }
    </div>
  }
</div>
