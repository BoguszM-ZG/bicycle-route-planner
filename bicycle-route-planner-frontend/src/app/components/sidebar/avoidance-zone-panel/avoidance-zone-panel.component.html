<div class="glass-panel">
  <div class="panel-header">
    <div class="header-title">
      <svg
        aria-hidden="true"
        focusable="false"
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="header-icon"
      >
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <h3>{{ 'SIDEBAR.ZONES_PANEL_TITLE' | translate }}</h3>
    </div>
    <span class="badge">{{ zones().length }}</span>
  </div>

  @if (isLoading()) {
    <div class="loading-message" aria-live="polite">
      <p>{{ 'SIDEBAR.LOADING' | translate }}</p>
    </div>
  } @else if (zones().length === 0) {
    <div class="empty-message">
      <p>{{ 'SIDEBAR.ZONES_PANEL_EMPTY' | translate }}</p>
    </div>
  } @else {
    <div class="zones-list">
      @for (zone of zones(); track zone.id) {
        <app-avoidance-zone-item [zone]="zone"></app-avoidance-zone-item>
      }
    </div>
  }
</div>
