<div class="toast-container" aria-live="polite" aria-atomic="true">
  @for (toast of notifications(); track toast.id) {
    <div class="toast" [ngClass]="toast.type" role="alert">
      <div class="toast-icon" aria-hidden="true">
        @if (toast.type === 'success') { <span>✓</span> }
        @if (toast.type === 'error') { <span>✖</span> }
        @if (toast.type === 'warning') { <span>⚠</span> }
        @if (toast.type === 'info') { <span>ℹ</span> }
      </div>

      <div class="toast-message">{{ toast.message | translate: toast.translationParams }}</div>

      <button
        class="toast-close"
        aria-label="Close notification"
        (click)="removeToast(toast.id)">
        &times;
      </button>
    </div>
  }
</div>
