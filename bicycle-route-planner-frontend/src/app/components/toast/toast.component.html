<div class="toast-container" aria-live="polite">
  @for (toast of notifications(); track toast.id) {
    <div class="toast {{ toast.type }}">
      <div class="toast-icon" aria-hidden="true">
        @switch (toast.type) {
          @case ('success') { ✓ }
          @case ('error') { ✖ }
          @case ('warning') { ⚠ }
          @case ('info') { ℹ }
        }
      </div>
      <div class="toast-message">{{ toast.message | translate: toast.translationParams }}</div>
      <button
        type="button"
        class="toast-close"
        [attr.aria-label]="'TOAST.CLOSE' | translate"
        (click)="removeToast(toast.id)">
        &times;
      </button>
    </div>
  }
</div>
