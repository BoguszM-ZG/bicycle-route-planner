<div class="map-floating-controls"
     role="toolbar"
     [attr.aria-label]="'MAP_CONTROLS.TOOLBAR_LABEL' | translate">

  <button type="button"
          class="control-btn"
          (click)="onLocateClick()"
          [title]="'MAP_CONTROLS.LOCATE_ME_TITLE' | translate">
    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
    {{ 'MAP_CONTROLS.LOCATE_ME' | translate }}
  </button>

  <button type="button"
          class="control-btn btn-save"
          (click)="onSaveClick()"
          [title]="'MAP_CONTROLS.SAVE_ROUTE_TITLE' | translate">
    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
      <polyline points="17 21 17 13 7 13 7 21"></polyline>
      <polyline points="7 3 7 8 15 8"></polyline>
    </svg>
    {{ 'MAP_CONTROLS.SAVE_ROUTE' | translate }}
  </button>

  <button type="button"
          class="control-btn btn-clear"
          (click)="onClearClick()"
          [title]="'MAP_CONTROLS.CLEAR_ROUTE_TITLE' | translate">
    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      <line x1="10" y1="11" x2="10" y2="17"></line>
      <line x1="14" y1="11" x2="14" y2="17"></line>
    </svg>
    {{ 'MAP_CONTROLS.CLEAR_ROUTE' | translate }}
  </button>
</div>
