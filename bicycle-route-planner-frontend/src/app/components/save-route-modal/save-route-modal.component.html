@if (isVisible()) {
  <div class="modal-backdrop"
       (click)="close()"
       (keydown.enter)="close()"
       (keydown.space)="close()"
       tabindex="-1">

    <dialog class="modal-glass"
            open
            aria-labelledby="save-route-title"
            (click)="$event.stopPropagation()"
            (keydown)="$event.stopPropagation()">

      <h2 id="save-route-title">{{ 'MODALS.SAVE_ROUTE_TITLE' | translate }}</h2>

      <label for="routeNameInput">{{ 'MODALS.SAVE_ROUTE_LABEL' | translate }}</label>

      <input
        #routeInput
        id="routeNameInput"
        type="text"
        [(ngModel)]="routeName"
        [placeholder]="'MODALS.SAVE_ROUTE_PLACEHOLDER' | translate"
        class="route-name-input"
        (keyup.enter)="saveRoute()"
        (keyup.escape)="close()"
      />

      <label for="folderSelect">{{ 'MODALS.FOLDER_SELECT_LABEL' | translate }}</label>

      <select id="folderSelect"
              [(ngModel)]="selectedFolderId"
              class="route-name-input"
              (keyup.escape)="close()">
        <option [ngValue]="null">{{ 'MODALS.NO_FOLDER' | translate }}</option>

        @for (folder of folders(); track folder.id) {
          <option [ngValue]="folder.id">{{ folder.name }}</option>
        }
      </select>

      <div class="modal-actions">
        <button class="btn-cancel" (click)="close()" [disabled]="isLoading()">
          {{ 'MODALS.CANCEL' | translate }}
        </button>
        <button class="btn-save" (click)="saveRoute()" [disabled]="isLoading()" aria-live="polite">
          {{ isLoading() ? ('MODALS.SAVING' | translate) : ('MODALS.SAVE' | translate) }}
        </button>
      </div>

    </dialog>
  </div>
}
