@if (isVisible()) {
  <div class="modal-backdrop">
    <div class="modal-glass">
      <h2>{{ 'MODALS.SAVE_ROUTE_TITLE' | translate }}</h2>
      <label for="routeNameInput">{{ 'MODALS.SAVE_ROUTE_LABEL' | translate }}</label>

      <input
      id="routeNameInput"
      type="text"
      [(ngModel)]="routeName"
      [placeholder]="'MODALS.SAVE_ROUTE_PLACEHOLDER' | translate"
      class="route-name-input"
      />

      <label for="folderSelect">{{ 'MODALS.FOLDER_SELECT_LABEL' | translate }}</label>
      <select id="folderSelect" [(ngModel)]="selectedFolderId" class="route-name-input" style="margin-bottom: 20px;">
        <option [ngValue]="null">{{ 'MODALS.NO_FOLDER' | translate }}</option>

        @for (folder of folders(); track folder.id) {
          <option [ngValue]="folder.id">{{ folder.name }}</option>
        }
      </select>

      <div class="modal-actions">
        <button class="btn-cancel" (click)="close()" [disabled]="isLoading()">{{ 'MODALS.CANCEL' | translate }}</button>
        <button class="btn-save" (click)="saveRoute()" [disabled]="isLoading()">
          {{ isLoading() ? ('MODALS.SAVING' | translate) : ('MODALS.SAVE' | translate) }}
        </button>
      </div>

    </div>
  </div>
}
