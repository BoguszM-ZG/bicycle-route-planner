@if (isVisible()) {
  <div class="modal-backdrop">
    <div class="modal-glass">
      <h2>{{ 'MODALS.SAVE_ZONE_TITLE' | translate }}</h2>
      <label for="zoneNameInput">{{ 'MODALS.SAVE_ZONE_LABEL' | translate }}</label>

      <input
        id="zoneNameInput"
        type="text"
        [formControl]="zoneNameControl"
        [placeholder]="'MODALS.SAVE_ZONE_PLACEHOLDER' | translate"
        class="route-name-input"
        [class.invalid]="zoneNameControl.invalid && zoneNameControl.touched"
      />

      <div class="modal-actions">
        <button class="btn-cancel" (click)="close()" [disabled]="isLoading()">{{ 'MODALS.CANCEL' | translate }}</button>
        <button class="btn-save" (click)="saveZone()" [disabled]="isLoading() || zoneNameControl.invalid">
          {{ isLoading() ? ('MODALS.SAVING' | translate) : ('MODALS.SAVE' | translate) }}
        </button>
      </div>
    </div>
  </div>
}
