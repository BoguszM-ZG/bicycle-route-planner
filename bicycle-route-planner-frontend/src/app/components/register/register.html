<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h2>Create an Account</h2>
      <p>Join the Bicycle Route Planner community today.</p>
    </div>

    <div *ngIf="errorMessage" class="error-alert">
      {{ errorMessage }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input 
          id="fullName" 
          type="text" 
          formControlName="fullName" 
          placeholder="e.g. John Doe"
          [class.invalid]="registerForm.get('fullName')?.invalid && registerForm.get('fullName')?.touched"
        />
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="you@example.com"
          [class.invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
        />
        <div class="error-text" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          Please enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="Minimum 8 characters"
          [class.invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
        />
        <div class="error-text" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          Password must be at least 8 characters long.
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign Up</span>
        <span *ngIf="isLoading" class="loader"></span>
      </button>
    </form>
    
    <div class="register-footer">
      Already have an account? <a href="/login">Log in here</a>
    </div>
  </div>
</div>
