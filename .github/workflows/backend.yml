name: Backend Build (Spring Boot)

on:
  push:
    paths:
      - 'bicycle-route-planner-backend/**'
  pull_request:
    paths:
      - 'bicycle-route-planner-backend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bicycle-route-planner-backend/backend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java (JDK 21)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests
