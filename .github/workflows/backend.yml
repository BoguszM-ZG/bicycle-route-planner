name: Backend CI (Spring Boot)

on:
  push:
    paths:
      - 'bicycle-route-planner-backend/**'
  pull_request:
    paths:
      - 'bicycle-route-planner-backend/**'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bicycle-route-planner-backend/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Run Tests with Maven & Testcontainers
        run: ./mvnw clean verify -B

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: ./bicycle-route-planner-backend/backend/target/surefire-reports/
          retention-days: 7
