spring.config.import=optional:file:.env[.properties]

spring.application.name=bicycle-route-planner-backend

# Hibernate / JPA
spring.jpa.open-in-view=false

# Spring Security
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# KONFIGURACJA BAZY DANYCH (POSTGIS)
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


#Konfiguracja JWT
application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.access-token-expiration-ms=90000000
application.security.jwt.refresh-token-expiration-ms=604800000

#Konfiguracja ORS
ors.api-key=${ORS_API_KEY}
ors.api-url=https://api.openrouteservice.org

#CORS Configuration
app.frontend.url=http://localhost:4200