services:
  postgis_db:
    image: postgis/postgis:15-3.4
    container_name: bicycle_postgis
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./bicycle-route-planner-backend/backend
      dockerfile: Dockerfile
    container_name: bicycle_backend
    depends_on:
      postgis_db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis_db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      ORS_API_KEY: ${ORS_API_KEY}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:4200}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./bicycle-route-planner-frontend
      dockerfile: Dockerfile
    container_name: bicycle_frontend
    depends_on:
      - backend
    ports:
      - "4200:8080"
    restart: unless-stopped

volumes:
  postgis_data:
